name = "kindle-dashboard"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 环境变量：微信 Token、轮询间隔、时区
[vars]
WECHAT_TOKEN = "kindle_dashboard_token"
POLL_INTERVAL = "30"
TIMEZONE = "Asia/Shanghai"

# D1 数据库绑定（database_id 由 `wrangler d1 create kindle-dashboard` 生成后填入）
[[d1_databases]]
binding = "DB"
database_name = "kindle-dashboard"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 把 .html 作为文本模块打包，供 src/index.js import 使用
[[rules]]
type = "Text"
globs = ["**/*.html"]
